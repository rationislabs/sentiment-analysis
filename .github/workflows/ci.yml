name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: |
          uv export --frozen --no-emit-project --no-emit-workspace --all-groups -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --disable-pip -r "$RUNNER_TEMP/requirements.txt"
