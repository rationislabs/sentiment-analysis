name: Collect
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    # Skipped until the repository variable HF_DATASET_REPO is set (README: one-time steps).
    if: vars.HF_DATASET_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev --group bert
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          # Exact match only: models.lock pins the commit, and a cache restored by prefix
          # could hold files from another one.
          key: hf-models-${{ hashFiles('model.yaml', 'models.lock') }}
      - run: uv run --no-sync python -m sentiment collect
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL_TOKEN: ${{ secrets.HF_MODEL_TOKEN }} # read-only; HF_TOKEN when unset
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
